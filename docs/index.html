<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Relay: your AI coding agents, wherever you are</title>
<meta name="description" content="Relay turns a computer at home into a server for your AI coding agents (Claude Code, Codex, Antigravity) across several subscription accounts, with an Android app, a voice assistant and a tiling desk for the desktop.">
<meta property="og:title" content="Relay">
<meta property="og:description" content="Your AI coding agents, wherever you are.">
<meta property="og:image" content="media/relay-ad-poster.jpg">
<meta property="og:video" content="media/relay-ad.mp4">
<style>
  :root { --bg: #121113; --ink: #f3efe6; --mute: #b8b2a6; --clay: #d97757; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 20% 0%, #3a2219 0%, var(--bg) 55%); color: var(--ink);
         font: 17px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, "Open Sans", sans-serif; }
  main { max-width: 1120px; margin: 0 auto; padding: 40px 16px 56px; }
  h1 { margin: 0; font-size: clamp(34px, 6vw, 56px); letter-spacing: -.03em; display: flex; align-items: center; gap: 14px; }
  h1 svg { width: 1.1em; height: 1.1em; color: var(--clay); }
  .tag { margin: 6px 0 26px; color: var(--mute); font-size: clamp(17px, 2.4vw, 22px); }
  video { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 14px; background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.55); }
  .links { margin-top: 22px; display: flex; gap: 12px; flex-wrap: wrap; }
  a.btn { color: var(--ink); text-decoration: none; padding: 10px 18px; border-radius: 999px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.06); }
  a.btn.main { background: var(--clay); border-color: var(--clay); color: #1f1e1b; font-weight: 600; }
  p.note { color: var(--mute); font-size: 14px; margin-top: 28px; }
</style>
</head>
<body>
<main>
  <h1><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" fill-rule="evenodd" d="M6,4H18A3,3 0,0 1,21 7V14A3,3 0,0 1,18 17H11L6,21V17A3,3 0,0 1,3 14V7A3,3 0,0 1,6 4Z M7.3,7.6L8.7,6.2L12.5,10.5L8.7,14.8L7.3,13.4L10,10.5Z M13,12.8H17V14.4H13Z"/></svg>Relay</h1>
  <p class="tag">Your AI coding agents, wherever you are: one home server, every AI subscription, every screen.</p>
  <video controls playsinline preload="metadata" poster="media/relay-ad-poster.jpg">
    <source src="media/relay-ad.mp4" type="video/mp4">
    Your browser can't play this video: <a href="media/relay-ad.mp4">download it (MP4)</a>.
  </video>
  <div class="links">
    <a class="btn main" href="https://github.com/chart21/relay">Relay on GitHub</a>
    <a class="btn" href="https://github.com/chart21/relay#setup">Setup</a>
  </div>
  <p class="note">2:14, with sound and captions. Everything shown is demo data.</p>
</main>
</body>
</html>
