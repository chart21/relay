[project]
name = "notifyd"
version = "0.1.0"
description = "Gateway that turns an always-on desktop into a hub for AI coding agents (Relay app backend)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "mcp>=2.3.0",
    "pyyaml>=6.0.3",
    "websockets>=17.1",
]

[project.scripts]
notifyd = "notifyd:main"
agent-run = "notifyd.launcher:main"

[build-system]
requires = ["uv_build>=0.11.18,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
voice = ["faster-whisper>=1.0"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
[tool.pytest.ini_options]
asyncio_mode = "auto"
